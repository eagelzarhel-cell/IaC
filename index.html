<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starter App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <button id="themeToggle" class="theme-btn">🌙 Dark Mode</button>
    <h1>Interactiv eCounter</h1>
    <div class="counter-value" id="count">0</div>
    <div class="btn-group">
      <button id="decrement" class="btn btn-secondary">-</button>
      <button id="reset" class="btn btn-outline">Reset</button>
      <button id="increment" class="btn btn-primary">+</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
